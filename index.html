<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>I Love You ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;
            color: white;

            background:
                radial-gradient(
                    circle at center,
                    #ff9bb5 0%,
                    #d92d68 45%,
                    #5b1232 100%
                );
        }

        .container {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* CORAÇÃO */
        .heart {
            width: 150px;
            height: 150px;

            margin: 0 auto 40px;

            position: relative;

            background: #ff174f;

            transform: rotate(-45deg);

            animation: pulsar 1s infinite;

            filter:
                drop-shadow(0 0 20px rgba(255,255,255,0.6));
        }

        .heart::before,
        .heart::after {
            content: "";

            position: absolute;

            width: 150px;
            height: 150px;

            background: #ff174f;

            border-radius: 50%;
        }

        .heart::before {
            top: -75px;
            left: 0;
        }

        .heart::after {
            top: 0;
            left: 75px;
        }

        /* TEXTO */
        h1 {
            margin: 0;

            font-size: clamp(45px, 10vw, 100px);

            letter-spacing: 5px;

            text-shadow:
                0 0 10px white,
                0 0 25px #ff6b91;

            animation: brilho 1.5s infinite alternate;
        }

        p {
            font-size: 20px;
            margin-top: 20px;
        }

        /* CORAÇÕES FLUTUANDO */
        .coracao {
            position: absolute;

            bottom: -50px;

            font-size: 25px;

            animation: subir linear forwards;

            pointer-events: none;
        }

        /* ANIMAÇÃO DO CORAÇÃO */
        @keyframes pulsar {

            0%,
            100% {
                transform: rotate(-45deg) scale(1);
            }

            50% {
                transform: rotate(-45deg) scale(1.15);
            }
        }

        /* ANIMAÇÃO DO TEXTO */
        @keyframes brilho {

            from {
                text-shadow:
                    0 0 10px white,
                    0 0 20px #ff6b91;
            }

            to {
                text-shadow:
                    0 0 20px white,
                    0 0 45px #ffb3c6;
            }
        }

        /* ANIMAÇÃO DOS CORAÇÕES */
        @keyframes subir {

            0% {
                transform:
                    translateY(0)
                    rotate(0deg);

                opacity: 1;
            }

            100% {
                transform:
                    translateY(-110vh)
                    rotate(360deg);

                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="heart"></div>

        <h1>I LOVE YOU ❤️</h1>

        <p>Feito para o amor da minha vida, minha litle monkey, minha princesa, meu tudo, eu te amo dms meu amor   ✨</p>

    </div>


    <script>

        function criarCoracao() {

            const coracao = document.createElement("div");

            coracao.classList.add("coracao");

            // Emojis aleatórios
            const emojis = [
                "❤️",
                "💕",
                "💖",
                "💗",
                "💘",
                "💞"
            ];

            coracao.innerHTML =
                emojis[
                    Math.floor(Math.random() * emojis.length)
                ];

            // Posição aleatória
            coracao.style.left =
                Math.random() * 100 + "vw";

            // Tamanho aleatório
            coracao.style.fontSize =
                (18 + Math.random() * 30) + "px";

            // Velocidade aleatória
            coracao.style.animationDuration =
                (4 + Math.random() * 5) + "s";

            document.body.appendChild(coracao);

            // Remove depois da animação
            setTimeout(() => {

                coracao.remove();

            }, 9000);
        }


        // Cria corações continuamente
        setInterval(criarCoracao, 350);

    </script>

</body>
</html>
